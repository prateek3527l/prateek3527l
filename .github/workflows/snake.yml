name: Generate Contribution Snake

on:
  schedule:
    # Run daily at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate-snake:
    name: Generate Snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Grid Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#5B8DEF&color_dots=#EFF6FF,#D7E5FA,#B8CCF4,#8DAFE5,#5B8DEF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#5B8DEF&color_dots=#0F172A,#1E3A5F,#3B6CB5,#5B8DEF,#B8CCF4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
