<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <style>
      .bg { fill: #0F172A; stroke: #1E3A5F; stroke-width: 1px; rx: 6px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #5B8DEF; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #64748B; }
      .date { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #64748B; }
      .stat { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #5B8DEF; text-anchor: middle; }
      .stat-sec { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #B8CCF4; text-anchor: middle; }
      .divider { stroke: #1E3A5F; stroke-width: 1px; }
    </style>
  </defs>
  <rect width="494" height="194" x="0.5" y="0.5" class="bg"/>
  
  <!-- Fire Icon / Ring -->
  <circle cx="247.5" cy="72" r="42" fill="none" stroke="#1E3A5F" stroke-width="4"/>
  <circle cx="247.5" cy="72" r="42" fill="none" stroke="#5B8DEF" stroke-width="4" stroke-dasharray="264" stroke-dashoffset="66" stroke-linecap="round"/>
  <path d="M247.5 50 C245 56 238 64 238 72 C238 78 242 82 247.5 82 C253 82 257 78 257 72 C257 66 253 60 247.5 50 Z" fill="#5B8DEF"/>
  
  <!-- Current Streak (Center) -->
  <text x="247.5" y="136" class="stat">Active</text>
  <text x="247.5" y="156" class="label" text-anchor="middle">Current Streak</text>
  <text x="247.5" y="174" class="date" text-anchor="middle">Synced via GitHub Actions</text>

  <!-- Dividers -->
  <line x1="165" y1="28" x2="165" y2="166" class="divider"/>
  <line x1="330" y1="28" x2="330" y2="166" class="divider"/>

  <!-- Total Contributions (Left) -->
  <text x="82.5" y="76" class="stat-sec">Steady</text>
  <text x="82.5" y="104" class="label" text-anchor="middle">Total Contributions</text>
  <text x="82.5" y="130" class="date" text-anchor="middle">Daily Dedication</text>

  <!-- Longest Streak (Right) -->
  <text x="412.5" y="76" class="stat-sec">Growing</text>
  <text x="412.5" y="104" class="label" text-anchor="middle">Longest Streak</text>
  <text x="412.5" y="130" class="date" text-anchor="middle">Building Consistency</text>
</svg>
